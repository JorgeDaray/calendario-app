<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Disponibilidad</title>
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container" class="pantalla-login">
        <div class="tarjeta-login">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="emailInput" placeholder="Correo electrónico" required>
            <input type="password" id="passwordInput" placeholder="Contraseña" required>
            <button id="btnLogin" class="btn azul">Entrar</button>
            <p id="loginError" class="error-texto oculto"></p>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL (Oculto por defecto hasta que inicias sesión) -->
    <div id="app-container" class="contenedor-principal oculto">
        <div class="cabecera-app">
            <!-- El nombre se inyectará dinámicamente aquí -->
            <h1>👋 Hola, <span id="nombreUsuarioHeader">...</span></h1>
            
            <!-- NUEVO: Contenedor para alinear los botones -->
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btnToggleTema" class="btn gris-claro" title="Cambiar tema">🌙</button>
                <button id="btnLogout" class="btn rojo-claro">Cerrar Sesión</button>
            </div>
        </div>

        <!-- ...resto de tu código... -->

        <div class="herramientas-calendario">
            <div class="filtro-fechas">
                <input type="date" id="inputBuscarFecha" class="input-herramienta">
                <button id="btnIrAFecha" class="btn gris-claro">Ir a Fecha</button>
            </div>
            <div class="filtros-vista">
                <label class="checkbox-filtro">
                    <input type="checkbox" id="chkVerDisponibles" checked> 🟢 Días Confirmados
                </label>
                <label class="checkbox-filtro">
                    <input type="checkbox" id="chkVerEventos" checked> 🎉 Eventos
                </label>
            </div>
        </div>
        
        <div id="calendar"></div>
        
        <div class="panel-mejores-dias">
            <h2>🏆 Mejores Días para Salir</h2>
            <ul id="listaMejoresDias">
                <li>Calculando...</li>
            </ul>
        </div>
    </div>

    <div id="modalDisponibilidad" class="modal-oculto">
        <div class="modal-contenido">
            <h3 id="modalFechaTexto">Selecciona tu estado</h3>
            <div class="modal-botones">
                <button id="btnDisponible" class="btn verde">✅ Disponible</button>
                <button id="btnProbable" class="btn amarillo">⚠️ Probable</button>
                <button id="btnLimpiar" class="btn gris">🗑️ Limpiar Día</button>
                <button id="btnCerrar" class="btn rojo">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ACTUALIZADO: VENTANA MODAL PARA CREAR/EDITAR EVENTO -->
    <div id="modalCrearEvento" class="modal-oculto">
        <div class="modal-contenido">
            <h3 id="tituloModalEvento">🎉 Crear Reunión Oficial</h3>
            <p id="textoFechaEvento" style="color: #6c757d; margin-bottom: 15px;"></p>
            
            <input type="text" id="inputTituloEvento" placeholder="Título (ej. Salida a cenar)" style="width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ced4da;">
            
            <!-- NUEVO: SELECTOR DE CATEGORÍAS -->
            <select id="selectCategoriaEvento" style="width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ced4da; background-color: white; font-size: 14px;">
                <option value="general">🎉 General / Otro</option>
                <option value="futbol">⚽ Reta de Fútbol</option>
                <option value="videojuegos">🎮 Videojuegos</option>
                <option value="comida">🍔 Salida a Comer</option>
                <option value="cine">🍿 Películas / Cine</option>
                <option value="fiesta">🍻 Fiesta / Tragos</option>
            </select>

            <input type="time" id="inputHoraEvento" style="width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ced4da;">
            <input type="text" id="inputUbicacionEvento" placeholder="Ubicación (ej. Punto Sao Paulo)" style="width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ced4da;">
            <textarea id="inputDescEvento" placeholder="Detalles extra..." style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ced4da;"></textarea>
            
            <div class="modal-botones">
                <button id="btnGuardarEvento" class="btn morado">Guardar Evento</button>
                <button id="btnCerrarCrearEvento" class="btn rojo">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalRSVP" class="modal-oculto">
        <div class="modal-contenido">
            <h3 id="modalRSVPTitulo" style="margin-bottom: 5px;">Título del Evento</h3>
            
            <div id="detallesEventoRSVP" class="detalles-evento">
                <p>📍 <span id="rsvpUbicacion">Ubicación</span></p>
                <p>🕒 <span id="rsvpFechaHora">Fecha y Hora</span></p>
                <p>📝 <span id="rsvpDescripcion">Descripción</span></p>
            </div>

            <a id="btnGoogleCalendar" href="#" target="_blank" class="btn blanco-borde" style="text-decoration: none; display: block; margin-bottom: 15px; color: #333;">📅 Agregar a Google Calendar</a>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

            <div id="controlesCreador" class="oculto" style="background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ffe69c; text-align: left;">
                <p style="margin: 0 0 10px 0; font-size: 14px; font-weight: bold; color: #664d03;">👑 Eres el organizador:</p>
                <div style="display: flex; gap: 10px;">
                    <button id="btnEditarEvento" class="btn azul" style="padding: 6px 12px; font-size: 13px; flex: 1;">✏️ Editar</button>
                    <button id="btnEliminarEvento" class="btn rojo" style="padding: 6px 12px; font-size: 13px; flex: 1;">🗑️ Cancelar</button>
                </div>
            </div>

            <h4 style="margin: 0 0 10px 0; text-align: left;">Asistentes:</h4>
            <ul id="listaAsistentes" class="lista-asistentes">
            </ul>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

            <p style="font-weight: bold;">Tu estado:</p>
            <div class="modal-botones">
                <button id="btnRSVPAsistire" class="btn verde">👍 Asistiré</button>
                <button id="btnRSVPEnEspera" class="btn amarillo">⏳ En Espera</button>
                <button id="btnRSVPNoAsistire" class="btn rojo">👎 No Asistiré</button>
                <button id="btnCerrarRSVP" class="btn gris">Cerrar Detalles</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
